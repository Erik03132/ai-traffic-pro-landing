# Деплой статики AI-Traffic PRO на GitHub Pages.
#
# Почему workflow, а не legacy-сборка: legacy брала корень ветки (там исходники
# Astro), и Pages отдавал 404. Workflow собирает `dist/` и отдаёт его как есть.
#
# API (заявки в Telegram + чат-виджет) живёт на VPS и не входит в статику:
# адрес подставляется через PUBLIC_API_BASE_URL на этапе сборки.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Astro 7 требует Node >=22.23.4 (engines в package.json astro).
      # Пин «24» — стабильная ветка LTS; «22» тянул 22.23.3 и ломал сборку.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Сборка
        run: npm run build
        env:
          PUBLIC_API_BASE_URL: ${{ vars.PUBLIC_API_BASE_URL }}
          # Резервный адрес API (Node-сервер на VPS). Используется, только если
          # основной (Cloudflare Worker) недоступен по сети — заявку нельзя терять.
          PUBLIC_API_FALLBACK_URL: ${{ vars.PUBLIC_API_FALLBACK_URL }}

      - name: Загрузка артефакта
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Деплой
        id: deployment
        uses: actions/deploy-pages@v4
