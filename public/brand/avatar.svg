<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" role="img" aria-label="AI traffic PRO">
  <!-- Единый аватар AI traffic PRO: классическая мишень на бежевом поле сайта.
       Три кольца одной толщины, сплошные вертикаль и горизонталь, между
       кольцами — короткие риски, как на пристрелочной мишени.
       Тераkотовый центр, от него — просвет: оси до него не доходят.
       Без текста: знак читается и в 40 px.
       Решения владельца (20.11.2026): контраст мягкий (тёмно-серый на
       бежевом), вокруг центра — пустое кольцо. -->
  <rect width="800" height="800" fill="#F7F4EF"/>

  <!-- сплошные оси мишени: от края до просвета у центра -->
  <g stroke="#4B4741" stroke-width="18">
    <line x1="400" y1="16" x2="400" y2="320"/>
    <line x1="400" y1="480" x2="400" y2="784"/>
    <line x1="16" y1="400" x2="320" y2="400"/>
    <line x1="480" y1="400" x2="784" y2="400"/>
  </g>

  <!-- три кольца одной толщины -->
  <g fill="none" stroke="#4B4741" stroke-width="34">
    <circle cx="400" cy="400" r="292"/>
    <circle cx="400" cy="400" r="206"/>
    <circle cx="400" cy="400" r="120"/>
  </g>

  <!-- риски между кольцами: поперечные насечки на осях -->
  <g stroke="#4B4741" stroke-width="12" stroke-linecap="butt">
    <line x1="372" y1="236" x2="428" y2="236"/>
    <line x1="372" y1="564" x2="428" y2="564"/>
    <line x1="236" y1="372" x2="236" y2="428"/>
    <line x1="564" y1="372" x2="564" y2="428"/>

    <line x1="376" y1="150" x2="424" y2="150"/>
    <line x1="376" y1="650" x2="424" y2="650"/>
    <line x1="150" y1="376" x2="150" y2="424"/>
    <line x1="650" y1="376" x2="650" y2="424"/>
  </g>

  <circle cx="400" cy="400" r="64" fill="#C2410C"/>
</svg>
